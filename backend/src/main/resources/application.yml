server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      # Never put the session ID in URLs (;jsessionid=...).
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        path: /
        # Local HTTP development. application-prod.yml turns on Secure and the __Host- prefix.
        secure: false
  # Error responses never carry internals (these are Boot's defaults, pinned explicitly).
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: backend
  # No datasource URL: Boot starts an embedded H2 with a unique name per application context
  # (so test contexts never share or drop each other's tables). Set spring.datasource.* for a real DB.
  jpa:
    open-in-view: false
    hibernate:
      # Local development and tests only (in-memory H2). The prod profile uses Flyway + validate.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    # Migrations (db/migration) are PostgreSQL SQL; enabled by the prod profile only.
    enabled: false

app:
  notify:
    slack:
      # Incoming Webhook of the confirmers' channel (secret). Empty: schedule notifications are off.
      webhook-url: ${SLACK_WEBHOOK_URL:}
      # Base URL for links in messages; Render provides RENDER_EXTERNAL_URL.
      public-url: ${APP_PUBLIC_URL:${RENDER_EXTERNAL_URL:}}
  # First ADMIN for a fresh database; ignored once any ADMIN exists (BootstrapAdminRunner).
  bootstrap-admin:
    login-identifier: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    # Exact origins only. "*" is rejected at startup.
    allowed-origins:
      - http://localhost:3000
  # Provisional (TASK-01). In-memory: needs a shared store with multiple instances.
  login-rate-limit:
    max-failures-per-identifier: 5
    max-failures-per-client: 50
    window: 15m
  # Signup attempts per client address (successful or not).
  signup-rate-limit:
    max-attempts-per-client: 10
    window: 1h

logging:
  level:
    # Never enable SQL parameter binding logs: they would print passwordHash values.
    org.hibernate.orm.jdbc.bind: OFF
