# Production overrides. Requires HTTPS end to end (or a proxy that forwards X-Forwarded-Proto).
server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # __Host- prefix: browser enforces Secure, Path=/ and no Domain attribute.
        name: __Host-SESSION
        secure: true

app:
  cors:
    # Comma-separated exact HTTPS origins, e.g. https://app.example.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
